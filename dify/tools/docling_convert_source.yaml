identity:
  name: "docling_convert_source"
  author: "podshalocef"
  label:
    en_US: "Docling convert source"
description:
  human:
    en_US: "Convert a document from a URL or base64, waiting up to 50 s (1 credit per PDF page, 10 per other file)."
  llm: "Convert a document from a URL or base64, waiting up to 50 s (1 credit per PDF page, 10 per other file). docling-serve's `POST /v1/convert/source`: converts one document given by https URL (`{\"kind\": \"http\", \"url\": ...}`) or inline (`{\"kind\": \"file\", \"base64_string\": ..., \"filename\": ...}`), waiting up to 50 seconds."
parameters:
  - name: "options"
    type: "string"
    required: false
    label:
      en_US: "Options"
    human_description:
      en_US: "Conversion options, a subset of docling-serve's. Any other option is refused with a 400 (`unsupported_option`). (JSON object)"
    llm_description: "Conversion options, a subset of docling-serve's. Any other option is refused with a 400 (`unsupported_option`). (JSON object)"
    form: "llm"
  - name: "sources"
    type: "string"
    required: true
    label:
      en_US: "Sources"
    human_description:
      en_US: "Exactly one source. (JSON array)"
    llm_description: "Exactly one source. (JSON array)"
    form: "llm"
  - name: "target"
    type: "string"
    required: false
    label:
      en_US: "Target"
    human_description:
      en_US: "Only `{\"kind\": \"inbody\"}`, the default: the result is in the response. (JSON object)"
    llm_description: "Only `{\"kind\": \"inbody\"}`, the default: the result is in the response. (JSON object)"
    form: "llm"
  - name: "callbacks"
    type: "string"
    required: false
    label:
      en_US: "Callbacks"
    human_description:
      en_US: "Not supported: leave it empty. (JSON array)"
    llm_description: "Not supported: leave it empty. (JSON array)"
    form: "llm"
extra:
  python:
    source: "tools/docling_convert_source.py"
